[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-event-labeler"
version = "0.2.0"
description = "Local-first multimodal video annotation and dataset tooling"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["video_labeler*"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["E501", "UP007"]
exclude = ["old", "tests", "video_event_labeler.py", "person_identity_labeler.py", "run_video_annotation.py"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
exclude = ["old", "tests", "video_event_labeler.py", "person_identity_labeler.py", "run_video_annotation.py"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["video_labeler.storage.*", "video_labeler.services", "video_labeler.quality"]
ignore_errors = true
