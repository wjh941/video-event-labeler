name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall video_labeler video_event_labeler.py person_identity_labeler.py run_video_annotation.py
      - run: ruff check video_labeler
      - run: mypy video_labeler --exclude 'video_labeler/(storage|services|quality)'
      - run: python -m pytest -q
