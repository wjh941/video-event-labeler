name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Python 3.11 is the verified CI baseline; the package still supports >=3.10.
        python: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall video_labeler video_event_labeler.py person_identity_labeler.py run_video_annotation.py
      - run: ruff check video_labeler
      - run: mypy video_labeler --exclude 'video_labeler/(storage|services|quality)'
      - run: python -m pytest -q -p no:cacheprovider
      # 根目录三份测试脚本(80 个用例,混合 unittest/pytest 风格)不在 testpaths 内,显式纳入回归
      - run: python -m pytest -q test_video_event_labeler.py test_person_identity_labeler.py test_integration_workflow.py
